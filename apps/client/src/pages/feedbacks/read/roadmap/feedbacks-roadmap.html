<div class="header">
  <div class="header__left">
    <app-link-back [version]="'b'" [where]="'/'" />

    <span class="left__title">Roadmap</span>
  </div>

  <app-link-main
    appUseMetaApp
    [varT]="'purple'"
    [label]="'+ Add Feedback'"
    [path]="'/feedbacks/post'"
  />
</div>

<app-page-wrapper [eventT]="'INFO'" [waitClient]="false">
  <ng-template #contentRef>
    <div class="root">
      <app-mobile-road-header />
      <app-tablet-road-header />

      <app-road-content-mobile />
      <app-road-content-tablet />
    </div>
  </ng-template>
</app-page-wrapper>
