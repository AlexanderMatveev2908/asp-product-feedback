<app-page-wrapper [waitClient]="false" [eventT]="'INFO'" [isPending]="!found()">
  <ng-template #contentRef>
    <div class="root">
      <div class="root__header">
        <app-link-back [version]="'a'" [where]="'/'" />
        <app-link-main appUseMetaApp [label]="'Edit Feedback'" varT="blue" [path]="pathEdit()" />
      </div>

      @if(found()){
      <app-feedback-responsive [item]="found()!" />}

      <div class="root__comments">
        <div class="comments__title">
          <span>{{ found()?.comments?.length ?? 0 }} Comments</span>
        </div>

        <div class="comments__content">
          @for(c of found()?.comments; track c.id; let idx = $index){
          <app-comment-item [comment]="c" [isLast]="idx === (found()?.comments?.length ?? 0) - 1" />
          }
        </div>
      </div>

      <app-comment-form [strategy]="strategy" />
    </div>
  </ng-template>
</app-page-wrapper>
