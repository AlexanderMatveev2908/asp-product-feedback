<div class="root">
  @if (isFirst()){
  <div class="root__line"></div>
  }
  <app-header-comment [comment]="reply()" [toggleCb]="useToggleReply.toggle" />

  <div class="root__content">
    <span class="content__replying_to">@{{ reply().replyingTo.username }}</span
    >&nbsp;<span class="content__reply">
      {{ reply().content }}
    </span>
  </div>

  <app-reply-form
    [formShown]="useToggleReply.showReply()"
    [commentId]="reply().commentId"
    [replyingToId]="reply().userId"
    [hideForm]="useToggleReply.hide"
  />
</div>
