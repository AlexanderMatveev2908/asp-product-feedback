<div class="root" [style.--border]="isLast() ? 'none' : '1px solid'">
  <app-header-comment [comment]="comment()" [toggleCb]="useToggleReply.toggle" />

  <div class="root__content">
    <span>
      {{ comment().content }}
    </span>
  </div>

  <app-reply-form
    [formShown]="useToggleReply.showReply()"
    [commentId]="comment().id"
    [replyingToId]="comment().userId"
    [hideForm]="useToggleReply.hide"
  />

  @if(comment().replies?.length){
  <div class="root__replies">
    @for (r of comment().replies; track r.id; let idx = $index){
    <app-reply-item [reply]="r" [isFirst]="idx === 0" />
    }
  </div>
  }
</div>
