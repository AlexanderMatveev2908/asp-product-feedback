<app-page-wrapper [waitClient]="true" [eventT]="'INFO'" [isPending]="!found()">
  <ng-template #contentRef>
    <div class="root">
      <app-link-back [version]="'a'" [where]="`/feedbacks/read/${found()?.id}`" />

      <app-feedback-form
        [strategy]="putStrategy"
        [existingItem]="found()"
        [delStrategy]="delStrategy"
      />
    </div>
  </ng-template>
</app-page-wrapper>
