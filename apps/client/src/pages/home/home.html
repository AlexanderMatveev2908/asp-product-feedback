<app-navbar-home-mobile />
<app-sidebar-mobile />

<app-header-tablet />

<div class="header">
  <div class="header__left">
    <div class="left__count">
      <div class="count__svg">
        <ng-container *ngComponentOutlet="SvgIdea" />
      </div>

      @let count = suggestionsCount();
      <div class="count__label">{{ count }} Suggestion{{ count !== 1 ? 's' : '' }}</div>
    </div>

    <app-main-drop />
  </div>
  <app-link-main
    appUseMetaApp
    [label]="'+ Add Feedback'"
    [varT]="'purple'"
    [path]="'/feedbacks/post'"
  />
</div>

<app-page-wrapper [waitClient]="false" [eventT]="'INFO'" [isPending]="isPending()" [minH]="'85vh'">
  <ng-template #contentRef>
    <div class="root">
      @if(!!feedbacks()?.length) {
      <!--  -->
      @for(p of sorted(); track p.id){
      <app-feedback-item [item]="p" [withHeader]="false" />
      }
      <!--  -->
      }@else{
      <app-home-no-data />
      }
    </div>
  </ng-template>
</app-page-wrapper>
