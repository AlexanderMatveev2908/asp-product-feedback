<app-navbar-home-mobile />
<app-sidebar-mobile />

<div class="header">
  <app-main-drop />
  <app-link-main
    appUseMetaApp
    [label]="'+ Add Feedback'"
    [varT]="'purple'"
    [path]="'/feedbacks/post'"
  />
</div>

<app-page-wrapper [waitClient]="false" [eventT]="'INFO'" [isPending]="isPending()" [minH]="'85vh'">
  <ng-template #contentRef>
    <div class="root">
      @if(!!feedbacks()?.length) {
      <!--  -->
      @for(p of sorted(); track p.id){
      <app-feedback-item [item]="p" [withHeader]="false" />
      }
      <!--  -->
      }@else{
      <app-home-no-data />
      }
    </div>
  </ng-template>
</app-page-wrapper>
