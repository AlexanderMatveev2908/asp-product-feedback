<app-popup [staticProps]="staticProps" [isPop]="usePop.isPop()">
  <ng-template #popContent>
    <div class="root">
      <div class="root__title">
        <span class="txt__lg text-center"> Your autogenerated user is</span>
        <span class="txt__2xl"> {{ user()?.username }}abs </span>
      </div>

      <div class="root__thumb">
        <img [src]="user()?.image?.url" alt="thumb random user" class="thumb__content" />
      </div>
    </div>
  </ng-template>
</app-popup>
