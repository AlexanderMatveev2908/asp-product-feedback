@if(footerWithLink()){
<a [routerLink]="pathComments()">
  <ng-container *ngTemplateOutlet="content" />
</a>
}
<!--  -->
@else {
<ng-container *ngTemplateOutlet="content" />

}

<ng-template #content>
  <div class="root">
    <div class="root__svg">
      <ng-content *ngComponentOutlet="Comment" />
    </div>

    @let l = item().comments?.length ?? 0 ;
    <span
      class="root__length"
      [ngClass]="responsive() ? 'root__length_rwd' : ''"
      [style.--opc]="l ? '1' : '50'"
    >
      {{ l }}
    </span>
  </div>
</ng-template>
