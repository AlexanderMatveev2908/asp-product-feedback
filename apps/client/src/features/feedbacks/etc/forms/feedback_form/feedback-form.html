<div class="root">
  <div class="root__svg">
    <ng-container *ngComponentOutlet="currSVG()" />
  </div>

  <form [formGroup]="currForm()" (ngSubmit)="onSubmit()" class="root__form">
    <div class="form__title">
      <span>{{ currTitle() }}</span>
    </div>

    <app-form-field-txt
      appUseFormField
      [f]="fields.title"
      [ctrl]="asFormControl('title')"
      [focusOnMount]="true"
    />

    <app-form-select appUseFormField [f]="fields.category" [ctrl]="asFormControl('category')" />

    @if(!isFormTypePost()){
    <app-form-select appUseFormField [f]="fields.status" [ctrl]="asFormControl('status')" />
    }

    <app-form-field-txt appUseFormField [f]="fields.content" [ctrl]="asFormControl('content')" />

    <app-feedback-form-mobile-footer
      [useTrackDelPending]="useTrackDelPending"
      [useTrackFormPending]="useTrackFormPending"
      [delFeed]="delFeed"
      [resetPreFilled]="resetPreFilled"
      [isFormTypePost]="isFormTypePost()"
    />

    <app-feedback-form-tablet-footer
      [useTrackDelPending]="useTrackDelPending"
      [useTrackFormPending]="useTrackFormPending"
      [delFeed]="delFeed"
      [resetPreFilled]="resetPreFilled"
      [isFormTypePost]="isFormTypePost()"
    />
  </form>
</div>
