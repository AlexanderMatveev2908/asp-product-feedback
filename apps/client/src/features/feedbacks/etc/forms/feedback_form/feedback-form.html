<div class="root">
  <div class="root__svg">
    <ng-container *ngComponentOutlet="currSVG()" />
  </div>

  <form [formGroup]="currForm()" (ngSubmit)="onSubmit()" class="root__form">
    <div class="form__title">
      <span class="txt__hd__md">{{ currTitle() }}</span>
    </div>

    <app-form-field-txt
      appUseFormField
      [f]="fields.title"
      [ctrl]="asFormControl('title')"
      [focusOnMount]="true"
    />

    <app-form-select appUseFormField [f]="fields.category" [ctrl]="asFormControl('category')" />

    @if(!isFormTypePost()){
    <app-form-select appUseFormField [f]="fields.status" [ctrl]="asFormControl('status')" />
    }

    <app-form-field-txt appUseFormField [f]="fields.content" [ctrl]="asFormControl('content')" />

    <div class="form__footer">
      <app-btn-main
        appUseMetaApp
        [label]="isFormTypePost() ? 'Add Feedback' : 'Save Changes'"
        [varT]="'purple'"
        [minW]="'100%'"
        [btnT]="'submit'"
        [isPending]="useApiTrack.isPending()"
      />
      <app-btn-main
        appUseMetaApp
        [label]="'Cancel'"
        [varT]="'blue_dark'"
        [minW]="'100%'"
        [btnT]="'button'"
        [onClick]="resetPreFilled"
        [isDisabled]="useApiTrack.isPending()"
      />
      <app-btn-main
        appUseMetaApp
        [label]="'Delete'"
        [varT]="'red'"
        [minW]="'100%'"
        [btnT]="'button'"
        [isDisabled]="useApiTrack.isPending()"
      />
    </div>
  </form>
</div>
