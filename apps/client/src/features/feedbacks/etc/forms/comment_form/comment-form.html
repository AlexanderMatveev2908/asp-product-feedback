<div class="root">
  <span class="root__title">Add Comment</span>

  <form class="root__content" [formGroup]="form" (ngSubmit)="onSubmit()">
    <app-form-field-txt appUseFormField [f]="field" [ctrl]="asFormControl('content')" />

    <div class="content__footer">
      <span class="footer__chars">{{ charsLeft() }} Characters left</span>

      <app-btn-main
        appUseMetaApp
        [varT]="'purple'"
        [label]="'Post Comment'"
        [btnT]="'submit'"
        [isPending]="useTrackApi.isPending()"
      />
    </div>
  </form>
</div>
