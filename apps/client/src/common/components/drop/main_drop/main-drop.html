<div #dropRef class="root">
  <button type="button" (click)="onClick()" class="root__btn">
    <div class="btn__label">
      <span> Sort by :</span>
      &nbsp;
      <span [style.opacity]="useDrop.isOpen() ? '75%' : '100%'">{{ currLabel() }}</span>
    </div>

    <div class="btn__svg">
      <div class="svg__item" [style.transform]="`rotate(${useDrop.isOpen() ? '180deg':'0deg'})`">
        <ng-container *ngComponentOutlet="Chevron" />
      </div>
    </div>
  </button>

  <div class="root__drop" [ngClass]="twd()" [style.opacity]="useDrop.isOpen() ? '1' : '0'">
    @for(s of options; track s.id; let idx = $index){
    <button
      (click)="onSortChange(s.field, s.val)"
      class="drop__opt"
      [style.--border]="idx === options.length - 1 ? 'none' : '1px solid'"
    >
      <span class="opt__label">
        {{ s.label }}
      </span>

      @if(isChosen(s.field, s.val)){
      <div class="drop_opt__svg">
        <ng-container *ngComponentOutlet="Check; inputs: { fill: 'white' }" />
      </div>
      }
    </button>
    }
  </div>
</div>
