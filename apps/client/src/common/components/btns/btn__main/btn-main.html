<button
  [type]="btnT()"
  (click)="onClick()?.()"
  [style.min-width]="minW()"
  class="root"
  [style.--hex_def]="useMetaApp.varsHex().hexDef"
  [style.--hex_hover]="useMetaApp.varsHex().hexHover"
  [disabled]="isDisabled() || isPending()"
>
  @if(isPending()){
  <app-spin-txt appUseMetaEventDir [eventT]="'NONE'" />
  }

  <span class="root__txt">
    @if(isPending()){ Pending... }
    <!--  -->
    @else{
    {{ useMetaApp.label() }}
    }
  </span>
</button>
